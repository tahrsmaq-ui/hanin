<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مطعم الشاورما الـ 3D</title>

  <!-- استيراد مكتبات Three.js و GSAP مع ScrollTrigger عبر CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f0c08;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    /* الـ Canvas لرسوميات 3D ثابت بالخلفية */
    #webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* أقسام التمرير (Scroll) */
    .section {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 20, 10, 0.45);
      backdrop-filter: blur(12px);
      padding: 35px 55px;
      border-radius: 20px;
      border: 1px solid rgba(255, 150, 50, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 12px;
      color: #ffb703;
      text-shadow: 0 0 25px rgba(255, 183, 3, 0.4);
    }

    p {
      font-size: 1.4rem;
      color: #e0d0c0;
    }
  </style>
</head>
<body>

  <canvas id="webgl"></canvas>

  <!-- القسم الأول -->
  <section class="section hero">
    <div class="card">
      <h1>شاورما 2026 🌯</h1>
      <p>قم بالتمرير للأسفل لرؤية السندويشة ثلاثية الأبعاد تفاعلياً</p>
    </div>
  </section>

  <!-- القسم الثاني -->
  <section class="section details">
    <div class="card">
      <h1>محمرة ومقمرة ✨</h1>
      <p>دوران وحركة السندويشة أثناء التمرير باستخدام Three.js & GSAP</p>
    </div>
  </section>

  <!-- القسم الثالث -->
  <section class="section footer">
    <div class="card">
      <h1>جاهزة للطلب! 🛵</h1>
      <p>يمكن استبدال هذا المجسم بموديل محشو حقيقي (.glb / .gltf)</p>
    </div>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. المشهد والكاميرا
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    // 2. الـ Renderer
    const canvas = document.querySelector('#webgl');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 3. بناء مجسم "صندويشة الشاورما" (أسطوانة مائلة ومنحنية الأطراف)
    const shawarmaGroup = new THREE.Group();

    // جسم السندويشة (الخبز الملفوف)
    const geometry = new THREE.CylinderGeometry(0.8, 0.75, 3.8, 32);
    const material = new THREE.MeshStandardMaterial({
      color: 0xd48c46, // لون خبز الصاج المحمر
      roughness: 0.6,
      metalness: 0.1
    });
    const shawarmaMesh = new THREE.Mesh(geometry, material);
    shawarmaGroup.add(shawarmaMesh);

    // إضافة خطوط التحمير والتأميرة على الخبز
    const stripeGeo = new THREE.CylinderGeometry(0.81, 0.76, 3.81, 32);
    const stripeMat = new THREE.MeshBasicMaterial({
      color: 0x5c2c16, // لون حروق الشواء
      wireframe: true
    });
    const stripes = new THREE.Mesh(stripeGeo, stripeMat);
    shawarmaGroup.add(stripes);

    // تدوير المجموع لتظهر السندويشة مائلة بشكل جذاب
    shawarmaGroup.rotation.z = Math.PI / 3;
    shawarmaGroup.rotation.x = 0.5;
    scene.add(shawarmaGroup);

    // 4. إضاءة احترافية (تعطي دفء للشاورما)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffaa55, 1.8);
    mainLight.position.set(5, 5, 5);
    scene.add(mainLight);

    const backLight = new THREE.PointLight(0xff5500, 1.5);
    backLight.position.set(-5, -5, -2);
    scene.add(backLight);

    // 5. ربط حركات السندويشة بالتمرير (ScrollTrigger)
    gsap.timeline({
      scrollTrigger: {
        trigger: ".details",
        start: "top bottom",
        end: "top top",
        scrub: 1,
      }
    })
    .to(shawarmaGroup.rotation, { x: Math.PI * 1.2, y: Math.PI * 1.5 })
    .to(shawarmaGroup.position, { x: -2.2, z: 1 }, "<");

    gsap.timeline({
      scrollTrigger: {
        trigger: ".footer",
        start: "top bottom",
        end: "top top",
        scrub: 1,
      }
    })
    .to(shawarmaGroup.rotation, { x: Math.PI * 2, y: Math.PI * 3 })
    .to(shawarmaGroup.position, { x: 2, z: -0.5 }, "<");

    // 6. التجاوب مع مقاسات الشاشة
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. حلقة العرض (Animation Loop)
    function animate() {
      requestAnimationFrame(animate);
      shawarmaGroup.rotation.y += 0.005; // دوران خفيف مستمر
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
