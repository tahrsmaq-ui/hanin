<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض منتج ثلاثي الأبعاد 3D</title>

  <!-- استيراد مكتبات Three.js و GSAP مع ScrollTrigger عبر CDN لتشغيلها مباشرة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    /* الـ Canvas يغطي الشاشة ويكون ثابتاً في الخلفية */
    #webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* أقسام الصفحة للتمرير (Scroll) */
    .section {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }

    p {
      font-size: 1.5rem;
      color: #aaaaaa;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 30px 50px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- الـ Canvas لرسوميات الـ 3D -->
  <canvas id="webgl"></canvas>

  <!-- القسم الأول -->
  <section class="section hero">
    <div class="card">
      <h1>تصميم مواقع 2026</h1>
      <p>قم بالتمرير للأسفل لاستكشاف مجسم الـ 3D التفاعلي</p>
    </div>
  </section>

  <!-- القسم الثاني -->
  <section class="section details">
    <div class="card">
      <h1>تفاعل وسلاسة عالية</h1>
      <p>تدوير وتحريك العنصر ربطاً بحركة التمرير (Scroll) باستخدام GSAP & Three.js</p>
    </div>
  </section>

  <!-- القسم الثالث -->
  <section class="section footer">
    <div class="card">
      <h1>تجربة مستخدم سينمائية</h1>
      <p>يمكن استبدال هذا المجسم التجريبي بأي نموذج 3D لمنتجك (.glb / .gltf)</p>
    </div>
  </section>

  <script>
    // 1. تسجيل إضافة ScrollTrigger لمكتبة GSAP
    gsap.registerPlugin(ScrollTrigger);

    // 2. إعداد المشهد والكاميرا
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // 3. إعداد الـ Renderer والربط مع الـ Canvas
    const canvas = document.querySelector('#webgl');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 4. إنشاء مجسم تجريبي 3D (عوضاً عن العلبة) وإضافة الإضاءة
    const geometry = new THREE.IcosahedronGeometry(1.8, 1);
    const material = new THREE.MeshStandardMaterial({
      color: 0x00ff88,
      wireframe: true
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // إضافة إضاءة للمشهد
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x00ff88, 2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 5. ربط حركة وموقع الـ 3D بالتمرير (GSAP ScrollTrigger)
    
    // التحريك عند الوصول للقسم الثاني
    gsap.timeline({
      scrollTrigger: {
        trigger: ".details",
        start: "top bottom",
        end: "top top",
        scrub: 1,
      }
    })
    .to(mesh.rotation, { x: Math.PI, y: Math.PI * 2 })
    .to(mesh.position, { x: -2, z: 1 }, "<");

    // التحريك عند الوصول للقسم الثالث
    gsap.timeline({
      scrollTrigger: {
        trigger: ".footer",
        start: "top bottom",
        end: "top top",
        scrub: 1,
      }
    })
    .to(mesh.rotation, { x: Math.PI * 2, y: Math.PI * 4 })
    .to(mesh.position, { x: 2, z: -1 }, "<");

    // 6. التعامل مع تغيير حجم الشاشة (Responsive)
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. حلقة العرض (Animation Render Loop)
    function animate() {
      requestAnimationFrame(animate);
      // تدوير خفيف مستمر للمجسم
      mesh.rotation.y += 0.003;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
