<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيناكِ حكاية جمال</title>
  <style>
    :root {
      --primary-glow: #e11d48;
      --secondary-glow: #9333ea;
      --bg-dark: #0a0a12;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #fda4af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(225, 29, 72, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* Container */
    .main-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(225, 29, 72, 0.1);
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #fff 30%, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* Navigation Buttons */
    .nav-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.8rem 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-btn:hover {
      background: rgba(225, 29, 72, 0.2);
      border-color: var(--primary-glow);
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #e11d48, #9333ea);
      border-color: transparent;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
    }

    /* Display Area */
    .content-box {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-item {
      display: none;
      width: 100%;
      animation: fadeIn 0.6s ease forwards;
    }

    .media-item.active {
      display: block;
    }

    .media-item img, 
    .media-item video {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }

    /* Poem & Text Section */
    .quote-box {
      margin-top: 1.8rem;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
    }

    .quote-text {
      font-size: 1.25rem;
      line-height: 1.8;
      color: #ffe4e6;
      font-weight: 500;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      .main-container { padding: 1.5rem 1rem; }
      h1 { font-size: 1.8rem; }
      .nav-btn { padding: 0.6rem 1rem; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>سحر عينيكِ ✨</h1>
    <p class="subtitle">اضغط على الأزرار لاكتشاف تفاصيل الجمال</p>

    <!-- الأزرار التفاعلية -->
    <div class="nav-buttons">
      <button class="nav-btn active" onclick="showTab(0)">النظرة الأولى 👁️</button>
      <button class="nav-btn" onclick="showTab(1)">عمق السحر ✨</button>
      <button class="nav-btn" onclick="showTab(2)">لحظة التناغم 🎥</button>
    </div>

    <!-- منطقة عرض الصور والفيديو -->
    <div class="content-box">
      <!-- الصورة الأولى -->
      <div class="media-item active">
        <img src="https://github.com/tahrsmaq-ui/hanin/blob/main/%D9%84%D9%82%D8%B7%D8%A9%20%D8%B4%D8%A7%D8%B4%D8%A9%202026-09-12%20023831.png" alt="صورة العيون الأولى">
      </div>
      
      <!-- الصورة الثانية -->
      <div class="media-item">
        <img src="https://github.com/tahrsmaq-ui/hanin/blob/main/WhatsApp%20Image%202026-09-13%20at%2012.31.17%20AM.jpeg" alt="صورة العيون الثانية">
      </div>
      
      <!-- الفيديو -->
      <div class="media-item">
        <video id="myVideo" controls poster="video-poster.jpg">
          <source src="https://github.com/tahrsmaq-ui/hanin/blob/main/WhatsApp%20Video%202026-09-12%20at%202.29.13%20AM.mp4" type="video/mp4">
          متصفحك لا يدعم تشغيل الفيديو.
        </video>
      </div>
    </div>

    <!-- نص الغزل المتحرك -->
    <div class="quote-box">
      <p class="quote-text" id="quoteText"></p>
    </div>
  </div>

  <script>
    // العبارات الخاصة بكل زر
    const quotes = [
      "وفي عينيكِ ألتقي بكونٍ كامل، لا زوايا له ولا نهاية... كأن الشمس تُشرق منهما فقط.",
      "سوادُ عينيكِ يختصر الليل، وبريقهما يروي قصة جمالٍ لم يُكتب مثلها في كُتب الغزل.",
      "كل حركة في عينيكِ موسيقى هادئة، تُرجع للقلب اتزانه وتلغي كركبة هذا العالم."
    ];

    const mediaItems = document.querySelectorAll('.media-item');
    const buttons = document.querySelectorAll('.nav-btn');
    const quoteText = document.getElementById('quoteText');
    const video = document.getElementById('myVideo');

    function showTab(index) {
      // إيقاف الفيديو إذا انتقل لزر آخر
      if (index !== 2 && !video.paused) {
        video.pause();
      }

      // تحديث الأزرار
      buttons.forEach(btn => btn.classList.remove('active'));
      buttons[index].classList.add('active');

      // تحديث المحتوى
      mediaItems.forEach(item => item.classList.remove('active'));
      mediaItems[index].classList.add('active');

      // تحديث العبارة
      quoteText.style.animation = 'none';
      quoteText.offsetHeight; // Reset animation
      quoteText.style.animation = 'fadeIn 0.6s ease forwards';
      quoteText.innerText = quotes[index];
    }

    // عرض العبارة الأولى عند التحميل
    quoteText.innerText = quotes[0];
  </script>

</body>
</html>
