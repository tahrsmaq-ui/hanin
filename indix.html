<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حنين ✨</title>
  <style>
    :root {
      --primary-glow: #f43f5e;
      --secondary-glow: #8b5cf6;
      --bg-dark: #090d16;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-sub: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(244, 63, 94, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.2) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 2.5rem 1.8rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #fff 20%, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem 1.3rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--primary-glow);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      border-color: transparent;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
    }

    .media-container {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .media-item {
      display: none;
      width: 100%;
      animation: fadeIn 0.5s ease forwards;
    }

    .media-item.active {
      display: block;
    }

    .media-item img, 
    .media-item video {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    .quote-box {
      margin-top: 1.5rem;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quote-text {
      font-size: 1.2rem;
      line-height: 1.7;
      color: #ffe4e6;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="main-card">
    <h1>سحر عينيكِ ✨</h1>
    <p class="subtitle">اضغط على الأزرار لاكتشاف تفاصيل الجمال</p>

    <div class="nav-buttons">
      <button class="nav-btn active" onclick="showTab(0)">النظرة الأولى 👁️</button>
      <button class="nav-btn" onclick="showTab(1)">عمق السحر ✨</button>
      <button class="nav-btn" onclick="showTab(2)">لحظة التناغم 🎥</button>
    </div>

    <div class="media-container">
      <!-- الصورة الأولى (يمكنك استبدال الرابط بـ eye1.jpg) -->
      <div class="media-item active">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=800" alt="صورة العيون الأولى">
      </div>
      
      <!-- الصورة الثانية (يمكنك استبدال الرابط بـ eye2.jpg) -->
      <div class="media-item">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800" alt="صورة العيون الثانية">
      </div>
      
      <!-- الفيديو (استبدل src بـ video.mp4) -->
      <div class="media-item">
        <video id="myVideo" controls>
          <source src="video.mp4" type="video/mp4">
          المتصفح لا يدعم تشغيل الفيديو.
        </video>
      </div>
    </div>

    <div class="quote-box">
      <p class="quote-text" id="quoteText"></p>
    </div>
  </div>

  <script>
    const quotes = [
      "وفي عينيكِ ألتقي بكونٍ كامل، لا زوايا له ولا نهاية... كأن الشمس تُشرق منهما فقط.",
      "سوادُ عينيكِ يختصر الليل، وبريقهما يروي قصة جمالٍ لم يُكتب مثلها في كُتب الغزل.",
      "كل حركة في عينيكِ موسيقى هادئة، تُرجع للقلب اتزانه وتلغي كركبة هذا العالم."
    ];

    const mediaItems = document.querySelectorAll('.media-item');
    const buttons = document.querySelectorAll('.nav-btn');
    const quoteText = document.getElementById('quoteText');
    const video = document.getElementById('myVideo');

    function showTab(index) {
      if (index !== 2 && !video.paused) {
        video.pause();
      }

      buttons.forEach(btn => btn.classList.remove('active'));
      buttons[index].classList.add('active');

      mediaItems.forEach(item => item.classList.remove('active'));
      mediaItems[index].classList.add('active');

      quoteText.style.animation = 'none';
      quoteText.offsetHeight; 
      quoteText.style.animation = 'fadeIn 0.5s ease forwards';
      quoteText.innerText = quotes[index];
    }

    quoteText.innerText = quotes[0];
  </script>

</body>
</html>
